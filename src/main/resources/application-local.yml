server:
  port: 0

spring:
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/valuehub_chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO
    org.springframework.data.mongodb: INFO
    org.hibernate.SQL: DEBUG
    com.sparta.chat_service: DEBUG
