spring:
  application:
    name: chat-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  codec:
    max-in-memory-size: 10MB
  mongodb:
    auto-index-creation: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  # servlet 스택 기준 (WebSocket/STOMP). WebFlux는 보조로 유지
  main:
    web-application-type: servlet
  kafka:
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sparta.chat_service.adaptor.in.kafka.ReservationEventPayload

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # instance-id는 EurekaInstancePortCustomizer에서 실제 할당 포트로 설정 (예: chat-service:51234)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  media:
    s3-bucket: ${S3_BUCKET:}
    cloudfront-base-url: ${CLOUDFRONT_BASE_URL:}
    aws-region: ${AWS_REGION:ap-northeast-2}
    max-file-size-bytes: 5242880
    presign-expire-seconds: 300
