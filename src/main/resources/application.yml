spring:
  application:
    name: chat-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  codec:
    max-in-memory-size: 10MB
  mongodb:
    auto-index-creation: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  # servlet 스택 기준 (WebSocket/STOMP). WebFlux는 보조로 유지
  main:
    web-application-type: servlet

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # instance-id는 EurekaInstancePortCustomizer에서 실제 할당 포트로 설정 (예: chat-service:51234)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
