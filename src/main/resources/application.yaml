server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: chatting-service

  data:
    mongodb:
      # 로컬 단일 노드 기본값 / 클러스터는 MONGODB_URI로 교체
      # 예) mongodb://user:pass@mongo1:27017,mongo2:27017,mongo3:27017/chatting_db?replicaSet=rs0&authSource=admin
      uri: ${MONGODB_URI:mongodb://admin:admin123@localhost:27017,localhost:27018,localhost:27019/?replicaSet=rs0&authSource=admin}
#      uri: ${MONGODB_URI:mongodb+srv://jason_db_user:UTKSmOrHXyHbTPpF@spharos.kz3esds.mongodb.net/}
      auto-index-creation: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.data.mongodb: INFO
    com.unionclass.chatting: DEBUG
