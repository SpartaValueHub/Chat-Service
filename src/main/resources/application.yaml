server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: chatting-service

  codec:
    max-in-memory-size: 10MB

  # Spring Boot 4+: 연결/인증은 spring.mongodb.* (구 spring.data.mongodb.uri 는 바인딩되지 않음 → credential=null)
  # WebFlux + reactive Mongo: starter-data-mongodb-reactive + 아래 인증/replicaSet 필수
  # Change Stream / @Tailable 은 replica set 필요. 전체 URI 오버라이드: SPRING_MONGODB_URI
  mongodb:
    host: mongo1
    port: 27017
    additional-hosts:
      - mongo2:27017
      - mongo3:27017
    database: chatting_db
    username: ${MONGODB_USERNAME:admin}
    password: ${MONGODB_PASSWORD:admin123}
    authentication-database: admin
    replica-set-name: rs0
  data:
    mongodb:
      auto-index-creation: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.springframework.data.mongodb: INFO
    com.unionclass.chatting: DEBUG
